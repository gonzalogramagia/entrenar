[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
serverless = true

[[services]]
name = "entrenate-backend"
source = "."

[services.variables]
GO_VERSION = "1.21"
CORS_ALLOWED_ORIGINS = "http://localhost:3210,http://localhost:5173,https://entrenate.net,https://entrenate.net,https://entrenate.up.railway.app"

[services.healthcheck]
path = "/api/health"
intervalSeconds = 30
timeoutSeconds = 10
