[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
serverless = true

[[services]]
name = "entrenar-backend"
source = "."

[services.variables]
GO_VERSION = "1.21"
CORS_ALLOWED_ORIGINS = "http://localhost:3210,http://localhost:5173,https://entrenar.app,https://www.entrenar.app,https://entrenar.up.railway.app"

[services.healthcheck]
path = "/api/health"
intervalSeconds = 30
timeoutSeconds = 10
